name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-ci:
    name: Backend (type-check, lint, test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reads pnpm version from root package.json's "packageManager" field —
      # no hardcoded version here, avoids drift from local dev environment.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to backend only: apps/frontend exists but is not yet covered
      # by this ticket (RTC-16 was scoped as backend CI). Frontend CI is a
      # deliberate fast-follow once its test/lint setup is confirmed. See PR
      # description for context.
      - name: Type-check & build (backend)
        run: pnpm --filter backend build

      - name: Lint (backend)
        run: pnpm --filter backend lint

      - name: Test (backend)
        run: pnpm --filter backend test